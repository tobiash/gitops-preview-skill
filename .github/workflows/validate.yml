name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      toolkit_version:
        description: Reviewed published GitOps Preview Toolkit release tag
        required: true
        type: string
        default: 'v0.2.0-rc.1'

permissions:
  contents: read

env:
  TOOLKIT_VERSION: ${{ inputs.toolkit_version || 'v0.2.0-rc.1' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate.py

  workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the reviewed published toolkit bundle
        run: |
          set -euo pipefail
          [[ "$TOOLKIT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          bundle="$RUNNER_TEMP/toolkit"
          mkdir -p "$bundle"
          base="https://github.com/tobiash/gitops-preview-toolkit/releases/download/$TOOLKIT_VERSION"
          archive="gitops-preview-toolkit_${TOOLKIT_VERSION}_linux_amd64.tar.gz"
          curl -fL --retry 3 "$base/checksums.txt" -o "$bundle/checksums.txt"
          curl -fL --retry 3 "$base/$archive" -o "$bundle/$archive"
          (cd "$bundle" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$bundle/$archive" -C "$bundle"
          for binary in gitops-preview fmp gitops-preview-flux gitops-preview-crossplane; do
            test -x "$bundle/$binary"
          done
          "$bundle/gitops-preview" agent schema > "$RUNNER_TEMP/schema.json"
      - name: Exercise the released primary host
        env:
          GITOPS_PREVIEW_BINARY: ${{ runner.temp }}/toolkit/gitops-preview
        run: python3 scripts/test-workflow.py
      - name: Exercise the compatibility entrypoint
        env:
          FMP_BINARY: ${{ runner.temp }}/toolkit/fmp
        run: python3 scripts/test-workflow.py

  crossplane:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: tobiash/gitops-preview-toolkit
          ref: ${{ env.TOOLKIT_VERSION }}
          path: .toolkit-source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .toolkit-source/go.mod
          cache-dependency-path: .toolkit-source/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the published bundle and approved real runtimes
        run: |
          set -euo pipefail
          [[ "$TOOLKIT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          bundle="$RUNNER_TEMP/toolkit"
          mkdir -p "$bundle"
          base="https://github.com/tobiash/gitops-preview-toolkit/releases/download/$TOOLKIT_VERSION"
          archive="gitops-preview-toolkit_${TOOLKIT_VERSION}_linux_amd64.tar.gz"
          curl -fL --retry 3 "$base/checksums.txt" -o "$bundle/checksums.txt"
          curl -fL --retry 3 "$base/$archive" -o "$bundle/$archive"
          (cd "$bundle" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$bundle/$archive" -C "$bundle"
          engine=https://releases.crossplane.io/stable/v2.4.2/bin/linux_amd64/crossplane
          curl -fL --retry 3 "$engine" -o "$bundle/crossplane-core"
          curl -fL --retry 3 "$engine.sha256" -o "$bundle/core.sha256"
          printf '%s  %s\n' "$(tr -d '[:space:]' < "$bundle/core.sha256")" "$bundle/crossplane-core" | sha256sum --check
          chmod +x "$bundle/crossplane-core"
          GOBIN="$bundle" go install github.com/crossplane-contrib/function-go-templating@v0.12.0
      - name: Test real nested Crossplane agent workflows
        env:
          GITOPS_PREVIEW_BINARY: ${{ runner.temp }}/toolkit/gitops-preview
          CROSSPLANE_ENGINE: ${{ runner.temp }}/toolkit/crossplane-core
          CROSSPLANE_FUNCTION_TARGET: 127.0.0.1:19443
          TOOLKIT_EXAMPLE_ROOT: ${{ github.workspace }}/.toolkit-source/docs/examples/nested-crossplane-flux
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/toolkit/function-go-templating" --insecure --address="$CROSSPLANE_FUNCTION_TARGET" > "$RUNNER_TEMP/function.log" 2>&1 &
          function_pid=$!
          trap 'kill "$function_pid" 2>/dev/null || true; wait "$function_pid" 2>/dev/null || true' EXIT
          python3 scripts/test-crossplane.py
